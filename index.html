<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sheila...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Parisienne&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a1f12 0%, #051009 100%);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Pantalla de Inicio (Welcome Screen) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a1f12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        #welcome-screen h1 {
            font-family: 'Parisienne', cursive;
            font-size: 3.5rem;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            text-align: center;
            padding: 0 20px;
        }

        .btn-abrir {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #0a1f12;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-abrir:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 215, 0, 0.4);
        }

        /* Contenedor Principal (Oculto al inicio) */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease 0.5s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Lluvia de Pétalos */
        .petal {
            position: absolute;
            background-color: #ffd700;
            border-radius: 150px 0 150px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            animation: fall linear infinite;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg) scale(1); opacity: 0; }
        }

        /* Textos Principales */
        .header {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 30px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideDown 1.5s ease forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #e0e0e0;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -10px;
        }

        .name {
            font-family: 'Parisienne', cursive;
            font-size: 6rem;
            background: linear-gradient(45deg, #ffd700, #fff6a1, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 10px 30px;
            line-height: 1.2;
            overflow: visible;
            filter: drop-shadow(0px 0px 15px rgba(255, 215, 0, 0.3));
        }

        /* Ramo Central SVG Animado */
        .flower-container {
            position: relative;
            z-index: 10;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        .flower-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: pulse 3s infinite alternate;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Polaroids Interactivas en 3D */
        .gallery {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .polaroid {
            position: absolute;
            background: white;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            width: 180px;
        }

        .polaroid img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #222;
        }

        .polaroid p {
            color: #333;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-top: 15px;
        }

        /* Efecto 3D Hover */
        .polaroid:hover {
            transform: scale(1.15) rotate(0deg) !important;
            z-index: 20;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        /* Posiciones dinámicas */
        .p1 { top: 15%; left: 10%; transform: rotate(-10deg); }
        .p2 { top: 20%; right: 10%; transform: rotate(12deg); }
        .p3 { bottom: 15%; left: 12%; transform: rotate(8deg); }
        .p4 { bottom: 20%; right: 12%; transform: rotate(-7deg); }

        @media (max-width: 900px) {
            .name { font-size: 4rem; }
            .flower-container { width: 250px; height: 250px; }
            .gallery { position: relative; height: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 50px; }
            .polaroid { position: relative; top: auto !important; left: auto !important; right: auto !important; bottom: auto !important; transform: rotate(0) !important; width: 160px; }
            .polaroid img { height: 140px; }
            #main-content { justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <!-- Música de fondo (Asegúrate de tener cancion.mp3 en tu carpeta) -->
    <audio id="bgMusic" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen">
        <h1>Para ti, mi hermosa...</h1>
        <button class="btn-abrir" onclick="iniciarSorpresa()">Abrir Sorpresa 🌻</button>
    </div>

    <!-- Contenido Principal -->
    <div id="main-content">
        
        <div class="header">
            <p class="subtitle">Feliz Día de las Flores Amarillas</p>
            <h1 class="name">Sheila Puchoc</h1>
        </div>

        <!-- Ramo Vectorial Brillante -->
        <div class="flower-container">
            <div class="flower-glow"></div>
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                <g transform="translate(100, 100)">
                    <path d="M-10,0 C-10,50 -30,80 -5,120 L5,120 C30,80 10,50 10,0 Z" fill="#2E5A1C"/>
                    <g id="flower-center">
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(0)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(45)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(90)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(135)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(180)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(225)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(270)"/>
                        <path d="M0,-20 L20,-70 L40,-20 Z" fill="#FFC107" transform="rotate(315)"/>
                        
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(22)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(67)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(112)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(157)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(202)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(247)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(292)"/>
                        <path d="M0,-15 L15,-55 L30,-15 Z" fill="#FFD54F" transform="rotate(337)"/>
                        
                        <circle cx="0" cy="0" r="25" fill="#5D4037"/>
                        <circle cx="0" cy="0" r="22" fill="#4E342E" stroke="#3E2723" stroke-width="2" stroke-dasharray="2,2"/>
                        <circle cx="-5" cy="-5" r="3" fill="#D7CCC8" opacity="0.6"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="gallery">
            <div class="polaroid p1">
                <!-- Foto 1 local -->
                <img src="foto1.jpg" alt="Nuestro momento especial">
                <p>Mi momento favorito</p>
            </div>
            <div class="polaroid p2">
                <!-- Foto 2 local -->
                <img src="foto2.jpg" alt="Aventura juntos">
                <p>Listos para Cusco ✈️</p>
            </div>
            <div class="polaroid p3">
                <!-- Foto 3 local -->
                <img src="foto3.jpg" alt="Siempre juntos">
                <p>Siempre juntos</p>
            </div>
            <div class="polaroid p4">
                <!-- Foto 4 local -->
                <img src="foto4.jpg" alt="Amor">
                <p>Te amo</p>
            </div>
        </div>

    </div>

    <script>
        // Función para iniciar la magia
        function iniciarSorpresa() {
            // Reproducir música (Forzamos la carga y reproducción primero)
            const audio = document.getElementById('bgMusic');
            audio.load(); // Obliga al navegador a leer el archivo
            audio.volume = 1.0; // Asegura que el volumen esté al máximo
            
            let playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // El audio empezó bien
                    console.log("Música sonando");
                }).catch(error => {
                    // El navegador lo bloqueó
                    console.log("Error de autoplay:", error);
                });
            }

            // Ocultar pantalla de bienvenida
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.visibility = 'hidden';
                welcome.style.display = 'none';
            }, 1500);

            // Mostrar contenido principal
            const mainContent = document.getElementById('main-content');
            mainContent.style.visibility = 'visible';
            mainContent.style.opacity = '1';

            // Iniciar pétalos
            crearPetalos();
        }
        function crearPetalos() {
            const main = document.getElementById('main-content');
            const cantidadPetalos = 30;

            for (let i = 0; i < cantidadPetalos; i++) {
                let petalo = document.createElement('div');
                petalo.classList.add('petal');
                
                let left = Math.random() * 100;
                let size = (Math.random() * 15) + 10;
                let duration = (Math.random() * 5) + 5;
                let delay = Math.random() * 5;

                petalo.style.left = left + 'vw';
                petalo.style.width = size + 'px';
                petalo.style.height = size + 'px';
                petalo.style.animationDuration = duration + 's';
                petalo.style.animationDelay = delay + 's';

                main.appendChild(petalo);
            }
        }
    </script>
</body>
</html>
